<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
    }

    #wireCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    #light {
      position: absolute;
      width: 440px;
      height: 440px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 145, 25, 0.08) 0%, rgba(180, 60, 10, 0.025) 35%, rgba(30, 10, 0, 0.005) 60%, transparent 75%);
      mix-blend-mode: screen;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 20;
      will-change: left, top;
    }

    #bulb {
      position: absolute;
      width: 80px;
      height: auto;
      transform-origin: 50% 0;
      cursor: grab;
      pointer-events: auto;
      user-select: none;
      -webkit-user-drag: none;
      touch-action: none;
      z-index: 10;
      will-change: transform, left, top;
    }
  </style>
</head>
<body>

  <main id="scene">
    <canvas id="wireCanvas"></canvas>
    <div id="light"></div>
    <img id="bulb" src="bulb.png" alt="">
  </main>

  <script>
    const canvas = document.getElementById('wireCanvas');
    const ctx = canvas.getContext('2d');
    const bulb = document.getElementById('bulb');
    const light = document.getElementById('light');

    bulb.ondragstart = () => false;

    const bulbWidth = 80;
    const filamentOffset = 58;

    let anchorX = window.innerWidth / 2;
    let anchorY = 0;

    const numPoints = 16;
    const restLength = 230;
    const restSegLength = restLength / (numPoints - 1);
    const gravity = 0.38;
    const damping = 0.982;

    const points = [];
    for (let i = 0; i < numPoints; i++) {
      const py = (restLength / (numPoints - 1)) * i;
      points.push({
        x: anchorX,
        y: py,
        oldX: anchorX,
        oldY: py
      });
    }

    let isDragging = false;
    let targetX = anchorX;
    let targetY = restLength;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      anchorX = window.innerWidth / 2;
      points[0].x = anchorX;
      points[0].y = anchorY;
    }

    window.addEventListener('resize', resize);
    resize();

    bulb.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      isDragging = true;
      bulb.style.cursor = 'grabbing';
      updateDrag(e.clientX, e.clientY);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      window.addEventListener('pointercancel', onPointerUp);
    });

    function onPointerMove(e) {
      if (!isDragging) return;
      updateDrag(e.clientX, e.clientY);
    }

    function onPointerUp() {
      if (!isDragging) return;
      isDragging = false;
      bulb.style.cursor = 'grab';
      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerup', onPointerUp);
      window.removeEventListener('pointercancel', onPointerUp);
    }

    function updateDrag(clientX, clientY) {
      const rawDx = clientX - anchorX;
      const rawDy = Math.max(60, clientY - anchorY);
      const angle = Math.atan2(rawDx, rawDy);

      const maxReach = window.innerHeight - 130;
      const pullRange = maxReach - restLength;

      let pullY = (clientY - restLength) / (window.innerHeight - restLength);
      pullY = Math.max(0, Math.min(1, pullY));

      const tensionY = Math.pow(pullY, 2.2);
      const targetDist = restLength + pullRange * tensionY;

      targetX = anchorX + Math.sin(angle) * targetDist;
      targetY = anchorY + Math.cos(angle) * targetDist;
    }

    function updatePhysics() {
      for (let i = 1; i < numPoints; i++) {
        const p = points[i];
        if (i === numPoints - 1 && isDragging) continue;

        const vx = (p.x - p.oldX) * damping;
        const vy = (p.y - p.oldY) * damping;

        p.oldX = p.x;
        p.oldY = p.y;

        p.x += vx;
        p.y += vy + gravity;
      }

      if (isDragging) {
        const endPoint = points[numPoints - 1];
        endPoint.oldX = endPoint.x;
        endPoint.oldY = endPoint.y;
        endPoint.x += (targetX - endPoint.x) * 0.25;
        endPoint.y += (targetY - endPoint.y) * 0.25;
      }

      const currentTotalDist = Math.hypot(points[numPoints - 1].x - anchorX, points[numPoints - 1].y - anchorY);
      const segLength = Math.max(restSegLength, currentTotalDist / (numPoints - 1));

      for (let iter = 0; iter < 12; iter++) {
        points[0].x = anchorX;
        points[0].y = anchorY;

        for (let i = 0; i < numPoints - 1; i++) {
          const p1 = points[i];
          const p2 = points[i + 1];
          const dx = p2.x - p1.x;
          const dy = p2.y - p1.y;
          const dist = Math.hypot(dx, dy) || 1;
          const diff = (dist - segLength) / dist;

          if (i === 0) {
            p2.x -= dx * diff;
            p2.y -= dy * diff;
          } else if (i + 1 === numPoints - 1 && isDragging) {
            p1.x += dx * diff;
            p1.y += dy * diff;
          } else {
            p1.x += dx * diff * 0.5;
            p1.y += dy * diff * 0.5;
            p2.x -= dx * diff * 0.5;
            p2.y -= dy * diff * 0.5;
          }
        }
      }
    }

    function render() {
      updatePhysics();

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < numPoints - 1; i++) {
        const xc = (points[i].x + points[i + 1].x) / 2;
        const yc = (points[i].y + points[i + 1].y) / 2;
        ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
      }
      ctx.lineTo(points[numPoints - 1].x, points[numPoints - 1].y);

      ctx.strokeStyle = '#111111';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();

      ctx.strokeStyle = '#2b2b2b';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      const pPrev = points[numPoints - 2];
      const pEnd = points[numPoints - 1];

      const dx = pEnd.x - pPrev.x;
      const dy = pEnd.y - pPrev.y;
      const dist = Math.hypot(dx, dy) || 1;
      const angle = -Math.atan2(dx, dy);

      bulb.style.left = (pEnd.x - bulbWidth / 2) + 'px';
      bulb.style.top = pEnd.y + 'px';
      bulb.style.transform = `rotate(${angle}rad)`;

      const lightX = pEnd.x + (dx / dist) * filamentOffset;
      const lightY = pEnd.y + (dy / dist) * filamentOffset;

      light.style.left = lightX + 'px';
      light.style.top = lightY + 'px';

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
