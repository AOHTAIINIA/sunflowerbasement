<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПРОЕКТ [НЕСАНКЦИОНИРОВАННЫЙ ДОСТУП]</title>
    <style>
        /* Стили старого CRT-монитора */
        body {
            margin: 0;
            padding: 20px;
            background-color: #030804;
            color: #1aff55;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
            text-shadow: 0 0 4px #1aff55;
        }

        /* Эффект сетки кинескопа (сканлайны) поверх всего экрана */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 100;
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
            border: 1px solid #145214;
            padding: 25px;
            box-shadow: inset 0 0 15px rgba(0, 255, 65, 0.1);
        }

        h1, h2 {
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px dashed #1aff55;
            padding-bottom: 5px;
        }

        p, label {
            font-size: 14px;
            line-height: 1.6;
        }

        button {
            background: #0d2811;
            color: #1aff55;
            border: 1px solid #1aff55;
            padding: 8px 16px;
            font-family: inherit;
            cursor: pointer;
            margin: 5px 0;
            transition: all 0.2s;
        }

        button:hover {
            background: #1aff55;
            color: #000;
            box-shadow: 0 0 10px #1aff55;
        }

        textarea, input {
            width: 100%;
            box-sizing: border-box;
            background: #021005;
            border: 1px solid #145214;
            color: #1aff55;
            font-family: inherit;
            padding: 10px;
            margin-top: 5px;
            outline: none;
        }

        textarea:focus, input:focus {
            border-color: #1aff55;
        }

        .box {
            margin: 25px 0;
            padding: 15px;
            border: 1px solid #145214;
            background: rgba(0, 20, 5, 0.4);
        }

        .output-box {
            margin-top: 10px;
            padding: 10px;
            min-height: 30px;
            background: #000;
            border-left: 3px solid #ff3333;
            color: #ff5555;
            text-shadow: 0 0 3px #ff3333;
            font-size: 15px;
        }

        .nav-links a {
            color: #ff3333;
            text-decoration: none;
            display: inline-block;
            margin-right: 15px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        /* Мигающий курсор */
        .blink {
            animation: blinker 1s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }
    </style>
</script>
</body>
</html>
