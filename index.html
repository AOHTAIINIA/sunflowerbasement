<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulb Concept</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
    }

    #light {
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 170, 50, 0.15) 0%, rgba(200, 110, 20, 0.07) 30%, rgba(100, 50, 0, 0.02) 55%, transparent 70%);
      mix-blend-mode: screen;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 20;
      will-change: left, top;
    }

    #wire {
      position: absolute;
      width: 4px;
      background-color: #151515;
      object-fit: fill;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      z-index: 5;
      will-change: transform, height, left, top;
    }

    #bulb {
      position: absolute;
      width: 80px;
      height: auto;
      cursor: grab;
      pointer-events: auto;
      user-select: none;
      -webkit-user-drag: none;
      touch-action: none;
      z-index: 10;
      will-change: transform, left, top;
    }
  </style>
</head>
<body>

  <main id="scene">
    <div id="light"></div>
    <img id="wire" src="wire.png" alt="">
    <img id="bulb" src="bulb.png" alt="">
  </main>

  <script>
    const wire = document.getElementById('wire');
    const bulb = document.getElementById('bulb');
    const light = document.getElementById('light');

    bulb.ondragstart = () => false;

    const bulbWidth = 80;
    const wireWidth = 4;

    let anchorX = window.innerWidth / 2;
    let anchorY = 0;

    const restLength = 250;
    const maxStretch = 320;
    const stiffness = 0.045;
    const gravity = 0.55;
    const damping = 0.982;

    let x = anchorX;
    let y = restLength;
    let vx = 0;
    let vy = 0;

    let isDragging = false;
    let dragOffsetX = 0;
    let dragOffsetY = 0;
    let targetX = x;
    let targetY = y;

    window.addEventListener('resize', () => {
      anchorX = window.innerWidth / 2;
    });

    bulb.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      isDragging = true;
      bulb.style.cursor = 'grabbing';
      dragOffsetX = e.clientX - x;
      dragOffsetY = e.clientY - y;
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      window.addEventListener('pointercancel', onPointerUp);
    });

    function onPointerMove(e) {
      if (!isDragging) return;
      let rawX = e.clientX - dragOffsetX;
      let rawY = e.clientY - dragOffsetY;

      let dx = rawX - anchorX;
      let dy = rawY - anchorY;

      if (dy < 40) dy = 40;

      const dist = Math.hypot(dx, dy);
      if (dist > maxStretch) {
        dx = (dx / dist) * maxStretch;
        dy = (dy / dist) * maxStretch;
      }

      targetX = anchorX + dx;
      targetY = anchorY + dy;
    }

    function onPointerUp() {
      if (!isDragging) return;
      isDragging = false;
      bulb.style.cursor = 'grab';
      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerup', onPointerUp);
      window.removeEventListener('pointercancel', onPointerUp);
    }

    function update() {
      if (isDragging) {
        vx = (targetX - x) * 0.5;
        vy = (targetY - y) * 0.5;
        x = targetX;
        y = targetY;
      } else {
        const dx = x - anchorX;
        const dy = y - anchorY;
        const dist = Math.hypot(dx, dy) || 1;
        const stretch = dist - restLength;

        const fx = -stiffness * stretch * (dx / dist);
        const fy = -stiffness * stretch * (dy / dist) + gravity;

        vx = (vx + fx) * damping;
        vy = (vy + fy) * damping;

        x += vx;
        y += vy;

        const currentDist = Math.hypot(x - anchorX, y - anchorY);
        if (currentDist > maxStretch) {
          x = anchorX + ((x - anchorX) / currentDist) * maxStretch;
          y = anchorY + ((y - anchorY) / currentDist) * maxStretch;
        }
      }

      const dx = x - anchorX;
      const dy = y - anchorY;
      const dist = Math.hypot(dx, dy);
      const angle = Math.atan2(dx, dy);

      wire.style.left = (anchorX - wireWidth / 2) + 'px';
      wire.style.top = anchorY + 'px';
      wire.style.height = (dist + 8) + 'px';
      wire.style.transformOrigin = (wireWidth / 2) + 'px 0px';
      wire.style.transform = `rotate(${angle}rad)`;

      bulb.style.left = (x - bulbWidth / 2) + 'px';
      bulb.style.top = y + 'px';
      bulb.style.transformOrigin = (bulbWidth / 2) + 'px 0px';
      bulb.style.transform = `rotate(${angle}rad)`;

      const filamentOffset = 50;
      const lightX = x + Math.sin(angle) * filamentOffset;
      const lightY = y + Math.cos(angle) * filamentOffset;

      light.style.left = lightX + 'px';
      light.style.top = lightY + 'px';

      requestAnimationFrame(update);
    }

    update();
  </script>
</body>
</html>
