<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
    }

    #light {
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 160, 40, 0.12) 0%, rgba(180, 80, 10, 0.04) 35%, rgba(40, 15, 0, 0.01) 55%, transparent 70%);
      mix-blend-mode: screen;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 15;
      will-change: left, top;
    }

    #wire {
      position: absolute;
      width: 8px;
      object-fit: fill;
      transform-origin: 50% 0;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      z-index: 6;
      filter: brightness(1.2) drop-shadow(0 0 1px rgba(255, 170, 50, 0.35));
      will-change: transform, height, left, top;
    }

    #bulb {
      position: absolute;
      width: 80px;
      height: auto;
      transform-origin: 50% 0;
      cursor: grab;
      pointer-events: auto;
      user-select: none;
      -webkit-user-drag: none;
      touch-action: none;
      z-index: 10;
      will-change: transform, left, top;
    }
  </style>
</head>
<body>

  <main id="scene">
    <div id="light"></div>
    <img id="wire" src="wire.png" alt="">
    <img id="bulb" src="bulb.png" alt="">
  </main>

  <script>
    const wire = document.getElementById('wire');
    const bulb = document.getElementById('bulb');
    const light = document.getElementById('light');

    const wireWidth = 8;
    const bulbWidth = 80;

    let anchorX = window.innerWidth / 2;
    let anchorY = 0;

    const restLength = 220;
    const stiffness = 0.06;
    const gravity = 0.6;
    const damping = 0.982;

    let x = anchorX;
    let y = restLength;
    let vx = 0;
    let vy = 0;

    let isDragging = false;
    let targetX = x;
    let targetY = y;

    window.addEventListener('resize', () => {
      anchorX = window.innerWidth / 2;
    });

    bulb.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      isDragging = true;
      bulb.setPointerCapture(e.pointerId);
      bulb.style.cursor = 'grabbing';
      updateTarget(e.clientX, e.clientY);
    });

    bulb.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      updateTarget(e.clientX, e.clientY);
    });

    bulb.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      try {
        bulb.releasePointerCapture(e.pointerId);
      } catch (err) {}
      bulb.style.cursor = 'grab';
    });

    bulb.addEventListener('pointercancel', () => {
      isDragging = false;
      bulb.style.cursor = 'grab';
    });

    function updateTarget(clientX, clientY) {
      let rawDx = clientX - anchorX;
      let rawDy = clientY - anchorY;

      if (rawDy < 50) rawDy = 50;

      const rawDist = Math.hypot(rawDx, rawDy);
      const angle = Math.atan2(rawDx, rawDy);

      const maxReach = window.innerHeight - 120;
      let targetDist = rawDist;

      if (rawDist > restLength) {
        const extra = rawDist - restLength;
        const available = Math.max(100, maxReach - restLength);
        const tension = 1 - Math.exp(-extra / (available * 1.5));
        targetDist = restLength + available * tension;
      }

      targetX = anchorX + Math.sin(angle) * targetDist;
      targetY = anchorY + Math.cos(angle) * targetDist;
    }

    function render() {
      if (isDragging) {
        vx = (targetX - x) * 0.16;
        vy = (targetY - y) * 0.16;
        x += vx;
        y += vy;
      } else {
        const dx = x - anchorX;
        const dy = y - anchorY;
        const dist = Math.hypot(dx, dy) || 1;
        const stretch = dist - restLength;

        const fx = -stiffness * stretch * (dx / dist);
        const fy = -stiffness * stretch * (dy / dist) + gravity;

        vx = (vx + fx) * damping;
        vy = (vy + fy) * damping;

        x += vx;
        y += vy;
      }

      const dx = x - anchorX;
      const dy = y - anchorY;
      const dist = Math.hypot(dx, dy);
      const angle = Math.atan2(dx, dy);

      wire.style.left = (anchorX - wireWidth / 2) + 'px';
      wire.style.top = anchorY + 'px';
      wire.style.height = (dist + 4) + 'px';
      wire.style.transform = `rotate(${angle}rad)`;

      bulb.style.left = (x - bulbWidth / 2) + 'px';
      bulb.style.top = y + 'px';
      bulb.style.transform = `rotate(${angle}rad)`;

      const filamentOffset = 46;
      const lightX = x + Math.sin(angle) * filamentOffset;
      const lightY = y + Math.cos(angle) * filamentOffset;

      light.style.left = lightX + 'px';
      light.style.top = lightY + 'px';

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
