<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
    }

    #wireCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    #light {
      position: absolute;
      width: 440px;
      height: 440px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 140, 25, 0.08) 0%, rgba(180, 60, 10, 0.025) 35%, rgba(30, 10, 0, 0.005) 60%, transparent 75%);
      mix-blend-mode: screen;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 20;
      will-change: left, top;
    }

    #bulb {
      position: absolute;
      width: 80px;
      height: auto;
      transform-origin: 50% 0;
      cursor: grab;
      pointer-events: auto;
      user-select: none;
      -webkit-user-drag: none;
      touch-action: none;
      z-index: 10;
      will-change: transform, left, top;
    }
  </style>
</head>
<body>

  <main id="scene">
    <canvas id="wireCanvas"></canvas>
    <div id="light"></div>
    <img id="bulb" src="bulb.png" alt="">
  </main>

  <script>
    const canvas = document.getElementById('wireCanvas');
    const ctx = canvas.getContext('2d');
    const bulb = document.getElementById('bulb');
    const light = document.getElementById('light');

    bulb.ondragstart = () => false;

    const bulbWidth = 80;
    const filamentOffset = 58;

    let anchorX = window.innerWidth / 2;
    let anchorY = 0;

    const numPoints = 18;
    const restLength = 220;
    const restSegLength = restLength / (numPoints - 1);

    const gravity = 0.45;
    const damping = 0.984;

    const points = [];
    for (let i = 0; i < numPoints; i++) {
      const py = restSegLength * i;
      points.push({
        x: anchorX,
        y: py,
        oldX: anchorX,
        oldY: py
      });
    }

    let isDragging = false;
    let targetX = anchorX;
    let targetY = restLength;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      anchorX = window.innerWidth / 2;
      points[0].x = anchorX;
      points[0].y = 0;
    }

    window.addEventListener('resize', resize);
    resize();

    bulb.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      isDragging = true;
      try {
        bulb.setPointerCapture(e.pointerId);
      } catch (err) {}
      bulb.style.cursor = 'grabbing';
      updateDrag(e.clientX, e.clientY);
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      updateDrag(e.clientX, e.clientY);
    });

    function endDrag(e) {
      if (!isDragging) return;
      isDragging = false;
      try {
        bulb.releasePointerCapture(e.pointerId);
      } catch (err) {}
      bulb.style.cursor = 'grab';
    }

    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', endDrag);

    function updateDrag(clientX, clientY) {
      const rawDx = clientX - anchorX;
      const rawDy = Math.max(40, clientY - anchorY);
      const rawDist = Math.hypot(rawDx, rawDy);
      const angle = Math.atan2(rawDx, rawDy);

      const maxDist = window.innerHeight - 100;
      let targetDist = restLength;

      if (rawDist > restLength) {
        const extra = rawDist - restLength;
        const maxExtra = maxDist - restLength;
        const progress = Math.min(1, extra / (window.innerHeight * 1.8));
        const tension = Math.pow(progress, 2.4);
        targetDist = restLength + maxExtra * tension;
      } else {
        targetDist = Math.max(60, rawDist);
      }

      targetX = anchorX + Math.sin(angle) * targetDist;
      targetY = anchorY + Math.cos(angle) * targetDist;
    }

    function updatePhysics() {
      const pEnd = points[numPoints - 1];

      for (let i = 1; i < numPoints; i++) {
        const p = points[i];
        if (isDragging && i === numPoints - 1) continue;

        const vx = (p.x - p.oldX) * damping;
        const vy = (p.y - p.oldY) * damping;

        p.oldX = p.x;
        p.oldY = p.y;

        p.x += vx;
        p.y += vy + gravity;
      }

      if (isDragging) {
        pEnd.oldX = pEnd.x;
        pEnd.oldY = pEnd.y;
        pEnd.x += (targetX - pEnd.x) * 0.35;
        pEnd.y += (targetY - pEnd.y) * 0.35;
      }

      const currentDist = Math.hypot(pEnd.x - anchorX, pEnd.y - anchorY);
      const segLen = isDragging ? Math.max(restSegLength, currentDist / (numPoints - 1)) : restSegLength;

      for (let iter = 0; iter < 18; iter++) {
        points[0].x = anchorX;
        points[0].y = 0;

        if (isDragging) {
          pEnd.x = targetX;
          pEnd.y = targetY;
        }

        for (let i = 0; i < numPoints - 1; i++) {
          const p1 = points[i];
          const p2 = points[i + 1];
          const dx = p2.x - p1.x;
          const dy = p2.y - p1.y;
          const dist = Math.hypot(dx, dy) || 0.001;
          const diff = (dist - segLen) / dist;

          if (i === 0) {
            p2.x -= dx * diff;
            p2.y -= dy * diff;
          } else if (i + 1 === numPoints - 1 && isDragging) {
            p1.x += dx * diff;
            p1.y += dy * diff;
          } else {
            p1.x += dx * diff * 0.5;
            p1.y += dy * diff * 0.5;
            p2.x -= dx * diff * 0.5;
            p2.y -= dy * diff * 0.5;
          }
        }
      }
    }

    function render() {
      updatePhysics();

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < numPoints - 1; i++) {
        const xc = (points[i].x + points[i + 1].x) / 2;
        const yc = (points[i].y + points[i + 1].y) / 2;
        ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
      }
      ctx.lineTo(points[numPoints - 1].x, points[numPoints - 1].y);

      ctx.strokeStyle = '#111111';
      ctx.lineWidth = 4.5;
      ctx.lineCap = 'round';
      ctx.stroke();

      ctx.strokeStyle = '#2c2c2c';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      const pPrev = points[numPoints - 2];
      const pEnd = points[numPoints - 1];

      const dx = pEnd.x - pPrev.x;
      const dy = pEnd.y - pPrev.y;
      const len = Math.hypot(dx, dy) || 1;

      const nx = dx / len;
      const ny = dy / len;

      const rotAngle = -Math.atan2(dx, dy);

      bulb.style.left = (pEnd.x - bulbWidth / 2) + 'px';
      bulb.style.top = pEnd.y + 'px';
      bulb.style.transform = `rotate(${rotAngle}rad)`;

      const lightX = pEnd.x + nx * filamentOffset;
      const lightY = pEnd.y + ny * filamentOffset;

      light.style.left = lightX + 'px';
      light.style.top = lightY + 'px';

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
