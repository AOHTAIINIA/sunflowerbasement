<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
    }

    #wireCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    #light {
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 140, 25, 0.08) 0%, rgba(180, 60, 10, 0.025) 35%, rgba(30, 10, 0, 0.005) 60%, transparent 75%);
      mix-blend-mode: screen;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 25;
      will-change: left, top;
    }

    #bulb {
      position: absolute;
      width: 80px;
      height: auto;
      transform-origin: 50% 0;
      cursor: grab;
      pointer-events: auto;
      user-select: none;
      -webkit-user-drag: none;
      touch-action: none;
      z-index: 20;
      will-change: transform, left, top;
    }

    #creature {
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 360px;
      pointer-events: none;
      z-index: 10;
    }

    #body-img {
      width: 100%;
      height: auto;
      display: block;
      position: relative;
      z-index: 12;
      user-select: none;
      -webkit-user-drag: none;
    }

    .arm-socket {
      position: absolute;
      top: 130px;
      width: 0;
      height: 0;
      z-index: 8;
    }

    #shoulder-left {
      left: 62px;
    }

    #shoulder-right {
      right: 62px;
    }

    .maggot-joint {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    .maggot-img {
      position: absolute;
      left: -85px;
      bottom: -30px;
      width: 170px;
      height: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      transform-origin: 50% 88%;
      will-change: transform;
    }

    #maggot-right-img {
      transform: scaleX(-1);
    }
  </style>
</head>
<body>

  <main id="scene">
    <canvas id="wireCanvas"></canvas>
    <div id="light"></div>
    <img id="bulb" src="bulb.png" alt="">

    <div id="creature">
      <div id="shoulder-left" class="arm-socket">
        <div id="joint-left" class="maggot-joint">
          <img id="maggot-left-img" class="maggot-img" src="maggot.png" alt="">
        </div>
      </div>

      <div id="shoulder-right" class="arm-socket">
        <div id="joint-right" class="maggot-joint">
          <img id="maggot-right-img" class="maggot-img" src="maggot.png" alt="">
        </div>
      </div>

      <img id="body-img" src="body.png" alt="">
    </div>
  </main>

  <script>
    const canvas = document.getElementById('wireCanvas');
    const ctx = canvas.getContext('2d');
    const bulb = document.getElementById('bulb');
    const light = document.getElementById('light');
    const jointLeft = document.getElementById('joint-left');
    const jointRight = document.getElementById('joint-right');
    const maggotLeftImg = document.getElementById('maggot-left-img');
    const maggotRightImg = document.getElementById('maggot-right-img');
    const shoulderLeft = document.getElementById('shoulder-left');
    const shoulderRight = document.getElementById('shoulder-right');

    bulb.ondragstart = () => false;

    const bulbWidth = 80;
    const filamentOffset = 58;
    const maggotReach = 210;

    let anchorX = window.innerWidth / 2;
    let anchorY = 0;

    const numPoints = 18;
    const restLength = 220;
    const restSegLength = restLength / (numPoints - 1);

    const gravity = 0.45;
    const damping = 0.984;

    const points = [];
    for (let i = 0; i < numPoints; i++) {
      const py = restSegLength * i;
      points.push({ x: anchorX, y: py, oldX: anchorX, oldY: py });
    }

    let isDragging = false;
    let isDead = false;
    let targetX = anchorX;
    let targetY = restLength;

    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      anchorX = window.innerWidth / 2;
      points[0].x = anchorX;
      points[0].y = 0;
    }

    window.addEventListener('resize', resize);
    resize();

    bulb.addEventListener('pointerdown', (e) => {
      if (isDead) return;
      initAudio();
      e.preventDefault();
      isDragging = true;
      try { bulb.setPointerCapture(e.pointerId); } catch (err) {}
      bulb.style.cursor = 'grabbing';
      updateDrag(e.clientX, e.clientY);
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging || isDead) return;
      updateDrag(e.clientX, e.clientY);
    });

    function endDrag(e) {
      if (!isDragging) return;
      isDragging = false;
      try { bulb.releasePointerCapture(e.pointerId); } catch (err) {}
      bulb.style.cursor = 'grab';
    }

    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', endDrag);

    function updateDrag(clientX, clientY) {
      const rawDx = clientX - anchorX;
      const rawDy = Math.max(40, clientY - anchorY);
      const rawDist = Math.hypot(rawDx, rawDy);
      const angle = Math.atan2(rawDx, rawDy);

      const maxDist = window.innerHeight - 30;
      let targetDist = restLength;

      if (rawDist > restLength) {
        const maxPull = window.innerHeight - restLength;
        const progress = Math.min(1, Math.max(0, (rawDist - restLength) / maxPull));
        const tension = Math.pow(progress, 1.15);
        targetDist = restLength + (maxDist - restLength) * tension;
      } else {
        targetDist = Math.max(50, rawDist);
      }

      targetX = anchorX + Math.sin(angle) * targetDist;
      targetY = anchorY + Math.cos(angle) * targetDist;
    }

    function updatePhysics() {
      const pEnd = points[numPoints - 1];

      for (let i = 1; i < numPoints; i++) {
        const p = points[i];
        if (isDragging && i === numPoints - 1) continue;

        const vx = (p.x - p.oldX) * damping;
        const vy = (p.y - p.oldY) * damping;

        p.oldX = p.x;
        p.oldY = p.y;

        p.x += vx;
        p.y += vy + gravity;
      }

      if (isDragging) {
        pEnd.oldX = pEnd.x;
        pEnd.oldY = pEnd.y;
        pEnd.x += (targetX - pEnd.x) * 0.35;
        pEnd.y += (targetY - pEnd.y) * 0.35;
      }

      const currentDist = Math.hypot(pEnd.x - anchorX, pEnd.y - anchorY);
      const segLen = isDragging ? Math.max(restSegLength, currentDist / (numPoints - 1)) : restSegLength;

      for (let iter = 0; iter < 18; iter++) {
        points[0].x = anchorX;
        points[0].y = 0;

        if (isDragging) {
          pEnd.x = targetX;
          pEnd.y = targetY;
        }

        for (let i = 0; i < numPoints - 1; i++) {
          const p1 = points[i];
          const p2 = points[i + 1];
          const dx = p2.x - p1.x;
          const dy = p2.y - p1.y;
          const dist = Math.hypot(dx, dy) || 0.001;
          const diff = (dist - segLen) / dist;

          if (i === 0) {
            p2.x -= dx * diff;
            p2.y -= dy * diff;
          } else if (i + 1 === numPoints - 1 && isDragging) {
            p1.x += dx * diff;
            p1.y += dy * diff;
          } else {
            p1.x += dx * diff * 0.5;
            p1.y += dy * diff * 0.5;
            p2.x -= dx * diff * 0.5;
            p2.y -= dy * diff * 0.5;
          }
        }
      }
    }

    function playGlassCrack() {
      if (!audioCtx) return;
      try {
        const bufferSize = audioCtx.sampleRate * 0.25;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.08));
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 3200;
        noise.connect(filter);
        filter.connect(audioCtx.destination);
        noise.start();
      } catch (err) {}
    }

    function breakBulbAndClose() {
      if (isDead) return;
      isDead = true;
      isDragging = false;

      playGlassCrack();

      bulb.style.display = 'none';
      light.style.display = 'none';
      canvas.style.display = 'none';

      setTimeout(() => {
        document.body.innerHTML = '';
        document.body.style.backgroundColor = '#000000';

        try {
          window.close();
        } catch (e) {}

        setTimeout(() => {
          location.href = 'about:blank';
        }, 120);
      }, 50);
    }

    function distToSegment(px, py, x1, y1, x2, y2) {
      const l2 = (x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1);
      if (l2 === 0) return Math.hypot(px - x1, py - y1);
      let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
    }

    const restAngleL = -1.25;
    const restAngleR = 1.25;

    let curAngleL = restAngleL;
    let curAngleR = restAngleR;

    let curStretchL = 1;
    let curStretchR = 1;

    let phaseL = Math.random() * 100;
    let phaseR = Math.random() * 100;
    let twitchL = 0;
    let twitchR = 0;

    let lastTime = performance.now();

    function render(currentTime) {
      if (isDead) return;

      const dt = Math.min(0.05, (currentTime - lastTime) * 0.001);
      lastTime = currentTime;

      updatePhysics();

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < numPoints - 1; i++) {
        const xc = (points[i].x + points[i + 1].x) / 2;
        const yc = (points[i].y + points[i + 1].y) / 2;
        ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
      }
      ctx.lineTo(points[numPoints - 1].x, points[numPoints - 1].y);

      ctx.strokeStyle = '#111111';
      ctx.lineWidth = 4.5;
      ctx.lineCap = 'round';
      ctx.stroke();

      ctx.strokeStyle = '#2c2c2c';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      const pPrev = points[numPoints - 2];
      const pEnd = points[numPoints - 1];

      const dx = pEnd.x - pPrev.x;
      const dy = pEnd.y - pPrev.y;
      const len = Math.hypot(dx, dy) || 1;
      const rotAngle = -Math.atan2(dx, dy);

      bulb.style.left = (pEnd.x - bulbWidth / 2) + 'px';
      bulb.style.top = pEnd.y + 'px';
      bulb.style.transform = `rotate(${rotAngle}rad)`;

      const bulbCenterBottomX = pEnd.x + (dx / len) * 55;
      const bulbCenterBottomY = pEnd.y + (dy / len) * 55;

      light.style.left = bulbCenterBottomX + 'px';
      light.style.top = bulbCenterBottomY + 'px';

      const rectL = shoulderLeft.getBoundingClientRect();
      const originLX = rectL.left;
      const originLY = rectL.top;

      const rectR = shoulderRight.getBoundingClientRect();
      const originRX = rectR.left;
      const originRY = rectR.top;

      const distLightL = Math.hypot(bulbCenterBottomX - originLX, bulbCenterBottomY - originLY);
      const distLightR = Math.hypot(bulbCenterBottomX - originRX, bulbCenterBottomY - originRY);

      const lightDetectRange = 380;
      const inRangeL = distLightL < lightDetectRange;
      const inRangeR = distLightR < lightDetectRange;

      if (Math.random() < 0.035) twitchL = (Math.random() - 0.5) * 1.5;
      if (Math.random() < 0.035) twitchR = (Math.random() - 0.5) * 1.5;
      twitchL *= 0.88;
      twitchR *= 0.88;

      phaseL += dt * (inRangeL ? 7.0 : 2.5);
      phaseR += dt * (inRangeR ? 7.0 : 3.1);

      const idleL = Math.sin(phaseL * 0.9) * 0.45
                  + Math.cos(phaseL * 2.3) * 0.25
                  + Math.sin(phaseL * 0.4) * 0.3
                  + twitchL;

      const idleR = Math.sin(phaseR * 0.8 + 1.4) * 0.45
                  + Math.cos(phaseR * 2.1 + 0.7) * 0.25
                  + Math.sin(phaseR * 0.5 + 2.2) * 0.3
                  + twitchR;

      let targetAngleL = restAngleL + idleL;
      let targetStretchL = 1;

      if (inRangeL) {
        const directL = Math.atan2(bulbCenterBottomX - originLX, -(bulbCenterBottomY - originLY));
        const reachFactorL = Math.min(1, Math.max(0, (lightDetectRange - distLightL) / lightDetectRange));
        const aggressiveFactorL = Math.pow(reachFactorL, 0.45);
        targetAngleL = targetAngleL * (1 - aggressiveFactorL) + directL * aggressiveFactorL;
        targetStretchL = 1 + aggressiveFactorL * 0.45;
      }

      let targetAngleR = restAngleR + idleR;
      let targetStretchR = 1;

      if (inRangeR) {
        const directR = Math.atan2(bulbCenterBottomX - originRX, -(bulbCenterBottomY - originRY));
        const reachFactorR = Math.min(1, Math.max(0, (lightDetectRange - distLightR) / lightDetectRange));
        const aggressiveFactorR = Math.pow(reachFactorR, 0.45);
        targetAngleR = targetAngleR * (1 - aggressiveFactorR) + directR * aggressiveFactorR;
        targetStretchR = 1 + aggressiveFactorR * 0.45;
      }

      const lerpSpeedL = inRangeL ? 0.38 : 0.08;
      const lerpSpeedR = inRangeR ? 0.38 : 0.08;

      curAngleL += (targetAngleL - curAngleL) * lerpSpeedL;
      curAngleR += (targetAngleR - curAngleR) * lerpSpeedR;

      curStretchL += (targetStretchL - curStretchL) * lerpSpeedL;
      curStretchR += (targetStretchR - curStretchR) * lerpSpeedR;

      jointLeft.style.transform = `rotate(${curAngleL}rad)`;
      jointRight.style.transform = `rotate(${curAngleR}rad)`;

      const waveL = 1 + Math.sin(phaseL * 3.2) * 0.08;
      const squishL = 1 / Math.sqrt(curStretchL * waveL);
      const skewL = Math.sin(phaseL * 2.2) * 9;

      const waveR = 1 + Math.sin(phaseR * 3.5 + 1.1) * 0.08;
      const squishR = 1 / Math.sqrt(curStretchR * waveR);
      const skewR = Math.sin(phaseR * 2.4 + 1.3) * 9;

      maggotLeftImg.style.transform = `scaleY(${curStretchL * waveL}) scaleX(${squishL}) skewX(${skewL}deg)`;
      maggotRightImg.style.transform = `scaleX(-1) scaleY(${curStretchR * waveR}) scaleX(${squishR}) skewX(${-skewR}deg)`;

      const actualLenL = maggotReach * curStretchL;
      const actualLenR = maggotReach * curStretchR;

      const tipLX = originLX + Math.sin(curAngleL) * actualLenL;
      const tipLY = originLY - Math.cos(curAngleL) * actualLenL;

      const tipRX = originRX + Math.sin(curAngleR) * actualLenR;
      const tipRY = originRY - Math.cos(curAngleR) * actualLenR;

      const contactDistL = distToSegment(bulbCenterBottomX, bulbCenterBottomY, originLX, originLY, tipLX, tipLY);
      const contactDistR = distToSegment(bulbCenterBottomX, bulbCenterBottomY, originRX, originRY, tipRX, tipRY);

      if (contactDistL < 38 || contactDistR < 38) {
        breakBulbAndClose();
        return;
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
