<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulb</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
    }

    #light {
      position: absolute;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 150, 30, 0.12) 0%, rgba(180, 75, 10, 0.04) 35%, rgba(40, 15, 0, 0.01) 60%, transparent 72%);
      mix-blend-mode: screen;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 20;
      will-change: left, top;
    }

    #wire {
      position: absolute;
      width: 5px;
      object-fit: fill;
      transform-origin: 50% 0;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      z-index: 5;
      background: linear-gradient(90deg, #1f1f1f, #4a4a4a 50%, #181818);
      box-shadow: 0 0 2px rgba(255, 170, 40, 0.25);
      will-change: transform, height, left, top;
    }

    #bulb {
      position: absolute;
      width: 80px;
      height: auto;
      transform-origin: 50% 0;
      cursor: grab;
      pointer-events: auto;
      user-select: none;
      -webkit-user-drag: none;
      touch-action: none;
      z-index: 10;
      will-change: transform, left, top;
    }
  </style>
</head>
<body>

  <main id="scene">
    <div id="light"></div>
    <img id="wire" src="wire.png" alt="">
    <img id="bulb" src="bulb.png" alt="">
  </main>

  <script>
    const wire = document.getElementById('wire');
    const bulb = document.getElementById('bulb');
    const light = document.getElementById('light');

    bulb.ondragstart = () => false;

    let anchorX = window.innerWidth / 2;
    let anchorY = 0;

    const restLength = 220;
    const stiffness = 0.06;
    const gravity = 0.65;
    const damping = 0.978;

    let x = anchorX;
    let y = restLength;
    let vx = 0;
    let vy = 0;

    let isDragging = false;
    let targetX = x;
    let targetY = y;

    window.addEventListener('resize', () => {
      anchorX = window.innerWidth / 2;
    });

    bulb.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      isDragging = true;
      bulb.style.cursor = 'grabbing';
      updateDragTarget(e.clientX, e.clientY);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      window.addEventListener('pointercancel', onPointerUp);
    });

    function onPointerMove(e) {
      if (!isDragging) return;
      updateDragTarget(e.clientX, e.clientY);
    }

    function onPointerUp() {
      if (!isDragging) return;
      isDragging = false;
      bulb.style.cursor = 'grab';
      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerup', onPointerUp);
      window.removeEventListener('pointercancel', onPointerUp);
    }

    function updateDragTarget(clientX, clientY) {
      const maxBottom = window.innerHeight - 150;
      const clampedMouseY = Math.max(60, Math.min(window.innerHeight, clientY));

      let calculatedY = clampedMouseY;
      if (clampedMouseY > restLength) {
        const progress = (clampedMouseY - restLength) / (window.innerHeight - restLength);
        const resistanceCurve = Math.pow(progress, 1.45);
        calculatedY = restLength + (maxBottom - restLength) * resistanceCurve;
      }

      const rawDx = clientX - anchorX;
      const maxSide = window.innerWidth * 0.45;
      const sideProgress = Math.max(-1, Math.min(1, rawDx / maxSide));
      const calculatedX = anchorX + sideProgress * maxSide * 0.7;

      targetX = calculatedX;
      targetY = calculatedY;
    }

    function render() {
      if (isDragging) {
        vx = (targetX - x) * 0.15;
        vy = (targetY - y) * 0.15;
        x += vx;
        y += vy;
      } else {
        const dx = x - anchorX;
        const dy = y - anchorY;
        const dist = Math.hypot(dx, dy) || 1;
        const stretch = dist - restLength;

        const fx = -stiffness * stretch * (dx / dist);
        const fy = -stiffness * stretch * (dy / dist) + gravity;

        vx = (vx + fx) * damping;
        vy = (vy + fy) * damping;

        x += vx;
        y += vy;
      }

      const dx = x - anchorX;
      const dy = y - anchorY;
      const dist = Math.hypot(dx, dy);
      const wireAngle = Math.atan2(dx, dy);
      const bulbAngle = wireAngle * 0.35;

      wire.style.left = anchorX + 'px';
      wire.style.top = anchorY + 'px';
      wire.style.height = (dist + 3) + 'px';
      wire.style.transform = `translate(-50%, 0) rotate(${wireAngle}rad)`;

      bulb.style.left = x + 'px';
      bulb.style.top = y + 'px';
      bulb.style.transform = `translate(-50%, 0) rotate(${bulbAngle}rad)`;

      const filamentOffset = 46;
      const lightX = x + Math.sin(bulbAngle) * filamentOffset;
      const lightY = y + Math.cos(bulbAngle) * filamentOffset;

      light.style.left = lightX + 'px';
      light.style.top = lightY + 'px';

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
