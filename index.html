<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
    }

    #wireCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    #light {
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 140, 25, 0.08) 0%, rgba(180, 60, 10, 0.025) 35%, rgba(30, 10, 0, 0.005) 60%, transparent 75%);
      mix-blend-mode: screen;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 25;
      will-change: left, top;
    }

    #bulb {
      position: absolute;
      width: 80px;
      height: auto;
      transform-origin: 50% 0;
      cursor: grab;
      pointer-events: auto;
      user-select: none;
      -webkit-user-drag: none;
      touch-action: none;
      z-index: 20;
      will-change: transform, left, top;
    }

    #creature {
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 380px;
      pointer-events: none;
      z-index: 10;
    }

    #body-img {
      width: 100%;
      height: auto;
      display: block;
      position: relative;
      z-index: 12;
      user-select: none;
      -webkit-user-drag: none;
    }

    .arm-socket {
      position: absolute;
      top: 135px;
      width: 0;
      height: 0;
      z-index: 8;
    }

    #shoulder-left {
      left: 65px;
    }

    #shoulder-right {
      right: 65px;
    }

    .maggot-joint {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    .maggot-img {
      position: absolute;
      left: -110px;
      bottom: -35px;
      width: 220px;
      height: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      transform-origin: 50% 88%;
      will-change: transform;
    }

    #maggot-right-img {
      transform: scaleX(-1);
    }

    #flash {
      position: fixed;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 99999;
    }
  </style>
</head>
<body>

  <main id="scene">
    <canvas id="wireCanvas"></canvas>
    <div id="light"></div>
    <img id="bulb" src="bulb.png" alt="">

    <div id="creature">
      <div id="shoulder-left" class="arm-socket">
        <div id="joint-left" class="maggot-joint">
          <img id="maggot-left-img" class="maggot-img" src="maggot.png" alt="">
        </div>
      </div>

      <div id="shoulder-right" class="arm-socket">
        <div id="joint-right" class="maggot-joint">
          <img id="maggot-right-img" class="maggot-img" src="maggot.png" alt="">
        </div>
      </div>

      <img id="body-img" src="body.png" alt="">
    </div>

    <div id="flash"></div>
  </main>

  <script>
    const canvas = document.getElementById('wireCanvas');
    const ctx = canvas.getContext('2d');
    const bulb = document.getElementById('bulb');
    const light = document.getElementById('light');
    const jointLeft = document.getElementById('joint-left');
    const jointRight = document.getElementById('joint-right');
    const maggotLeftImg = document.getElementById('maggot-left-img');
    const maggotRightImg = document.getElementById('maggot-right-img');
    const shoulderLeft = document.getElementById('shoulder-left');
    const shoulderRight = document.getElementById('shoulder-right');
    const flash = document.getElementById('flash');

    bulb.ondragstart = () => false;

    const bulbWidth = 80;
    const filamentOffset = 58;
    const maggotBaseReach = 200;

    let anchorX = window.innerWidth / 2;
    let anchorY = 0;

    const numPoints = 18;
    const restLength = 220;
    const restSegLength = restLength / (numPoints - 1);

    const gravity = 0.45;
    const damping = 0.984;

    const points = [];
    for (let i = 0; i < numPoints; i++) {
      const py = restSegLength * i;
      points.push({ x: anchorX, y: py, oldX: anchorX, oldY: py });
    }

    let isDragging = false;
    let isDead = false;
    let targetX = anchorX;
    let targetY = restLength;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      anchorX = window.innerWidth / 2;
      points[0].x = anchorX;
      points[0].y = 0;
    }

    window.addEventListener('resize', resize);
    resize();

    bulb.addEventListener('pointerdown', (e) => {
      if (isDead) return;
      e.preventDefault();
      isDragging = true;
      try { bulb.setPointerCapture(e.pointerId); } catch (err) {}
      bulb.style.cursor = 'grabbing';
      updateDrag(e.clientX, e.clientY);
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging || isDead) return;
      updateDrag(e.clientX, e.clientY);
    });

    function endDrag(e) {
      if (!isDragging) return;
      isDragging = false;
      try { bulb.releasePointerCapture(e.pointerId); } catch (err) {}
      bulb.style.cursor = 'grab';
    }

    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', endDrag);

    function updateDrag(clientX, clientY) {
      const rawDx = clientX - anchorX;
      const rawDy = Math.max(40, clientY - anchorY);
      const rawDist = Math.hypot(rawDx, rawDy);
      const angle = Math.atan2(rawDx, rawDy);

      const maxDist = window.innerHeight - 30;
      let targetDist = restLength;

      if (rawDist > restLength) {
        const maxPull = window.innerHeight - restLength;
        const progress = Math.min(1, Math.max(0, (rawDist - restLength) / maxPull));
        const tension = Math.pow(progress, 1.15);
        targetDist = restLength + (maxDist - restLength) * tension;
      } else {
        targetDist = Math.max(50, rawDist);
      }

      targetX = anchorX + Math.sin(angle) * targetDist;
      targetY = anchorY + Math.cos(angle) * targetDist;
    }

    function updatePhysics() {
      const pEnd = points[numPoints - 1];

      for (let i = 1; i < numPoints; i++) {
        const p = points[i];
        if (isDragging && i === numPoints - 1) continue;

        const vx = (p.x - p.oldX) * damping;
        const vy = (p.y - p.oldY) * damping;

        p.oldX = p.x;
        p.oldY = p.y;

        p.x += vx;
        p.y += vy + gravity;
      }

      if (isDragging) {
        pEnd.oldX = pEnd.x;
        pEnd.oldY = pEnd.y;
        pEnd.x += (targetX - pEnd.x) * 0.35;
        pEnd.y += (targetY - pEnd.y) * 0.35;
      }

      const currentDist = Math.hypot(pEnd.x - anchorX, pEnd.y - anchorY);
      const segLen = isDragging ? Math.max(restSegLength, currentDist / (numPoints - 1)) : restSegLength;

      for (let iter = 0; iter < 18; iter++) {
        points[0].x = anchorX;
        points[0].y = 0;

        if (isDragging) {
          pEnd.x = targetX;
          pEnd.y = targetY;
        }

        for (let i = 0; i < numPoints - 1; i++) {
          const p1 = points[i];
          const p2 = points[i + 1];
          const dx = p2.x - p1.x;
          const dy = p2.y - p1.y;
          const dist = Math.hypot(dx, dy) || 0.001;
          const diff = (dist - segLen) / dist;

          if (i === 0) {
            p2.x -= dx * diff;
            p2.y -= dy * diff;
          } else if (i + 1 === numPoints - 1 && isDragging) {
            p1.x += dx * diff;
            p1.y += dy * diff;
          } else {
            p1.x += dx * diff * 0.5;
            p1.y += dy * diff * 0.5;
            p2.x -= dx * diff * 0.5;
            p2.y -= dy * diff * 0.5;
          }
        }
      }
    }

    function breakBulbAndClose() {
      if (isDead) return;
      isDead = true;
      isDragging = false;

      flash.style.opacity = '1';
      bulb.style.display = 'none';
      light.style.display = 'none';
      canvas.style.display = 'none';

      setTimeout(() => {
        document.body.innerHTML = '';
        document.body.style.backgroundColor = '#000000';

        try {
          window.close();
        } catch (e) {}

        setTimeout(() => {
          location.href = 'about:blank';
        }, 120);
      }, 50);
    }

    const restAngleL = -1.25;
    const restAngleR = 1.25;

    let curAngleL = restAngleL;
    let curAngleR = restAngleR;

    let curStretchL = 1;
    let curStretchR = 1;

    let phaseL = 12.4;
    let phaseR = 88.9;
    let twitchL = 0;
    let twitchR = 0;

    let lastTime = performance.now();

    function render(currentTime) {
      if (isDead) return;

      const dt = Math.min(0.05, (currentTime - lastTime) * 0.001);
      lastTime = currentTime;

      updatePhysics();

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < numPoints - 1; i++) {
        const xc = (points[i].x + points[i + 1].x) / 2;
        const yc = (points[i].y + points[i + 1].y) / 2;
        ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
      }
      ctx.lineTo(points[numPoints - 1].x, points[numPoints - 1].y);

      ctx.strokeStyle = '#111111';
      ctx.lineWidth = 4.5;
      ctx.lineCap = 'round';
      ctx.stroke();

      ctx.strokeStyle = '#2c2c2c';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      const pPrev = points[numPoints - 2];
      const pEnd = points[numPoints - 1];

      const dx = pEnd.x - pPrev.x;
      const dy = pEnd.y - pPrev.y;
      const len = Math.hypot(dx, dy) || 1;
      const rotAngle = -Math.atan2(dx, dy);

      bulb.style.left = (pEnd.x - bulbWidth / 2) + 'px';
      bulb.style.top = pEnd.y + 'px';
      bulb.style.transform = `rotate(${rotAngle}rad)`;

      const bulbCenterX = pEnd.x + (dx / len) * 55;
      const bulbCenterY = pEnd.y + (dy / len) * 55;

      light.style.left = bulbCenterX + 'px';
      light.style.top = bulbCenterY + 'px';

      const rectL = shoulderLeft.getBoundingClientRect();
      const originLX = rectL.left;
      const originLY = rectL.top;

      const rectR = shoulderRight.getBoundingClientRect();
      const originRX = rectR.left;
      const originRY = rectR.top;

      const distLightL = Math.hypot(bulbCenterX - originLX, bulbCenterY - originLY);
      const distLightR = Math.hypot(bulbCenterX - originRX, bulbCenterY - originRY);

      const triggerZone = 340;
      const inZoneL = distLightL < triggerZone;
      const inZoneR = distLightR < triggerZone;

      if (Math.random() < 0.04) twitchL = (Math.random() - 0.5) * 1.8;
      if (Math.random() < 0.04) twitchR = (Math.random() - 0.5) * 1.8;
      twitchL *= 0.85;
      twitchR *= 0.85;

      phaseL += dt * (inZoneL ? 9.0 : 2.7);
      phaseR += dt * (inZoneR ? 8.4 : 3.4);

      const idleL = Math.sin(phaseL * 0.95) * 0.42
                  + Math.cos(phaseL * 2.1) * 0.22
                  + Math.sin(phaseL * 0.37) * 0.3
                  + twitchL;

      const idleR = Math.sin(phaseR * 0.82 + 1.9) * 0.42
                  + Math.cos(phaseR * 1.9 + 0.5) * 0.22
                  + Math.sin(phaseR * 0.44 + 2.8) * 0.3
                  + twitchR;

      let targetAngleL = restAngleL + idleL;
      let targetStretchL = 1;

      if (inZoneL) {
        const directL = Math.atan2(bulbCenterX - originLX, -(bulbCenterY - originLY));
        const kL = Math.pow((triggerZone - distLightL) / triggerZone, 0.5);
        const lungeJitterL = Math.sin(currentTime * 0.06) * 0.15;
        targetAngleL = targetAngleL * (1 - kL) + (directL + lungeJitterL) * kL;
        targetStretchL = 1 + kL * 0.5;
      }

      let targetAngleR = restAngleR + idleR;
      let targetStretchR = 1;

      if (inZoneR) {
        const directR = Math.atan2(bulbCenterX - originRX, -(bulbCenterY - originRY));
        const kR = Math.pow((triggerZone - distLightR) / triggerZone, 0.5);
        const lungeJitterR = Math.cos(currentTime * 0.065) * 0.15;
        targetAngleR = targetAngleR * (1 - kR) + (directR + lungeJitterR) * kR;
        targetStretchR = 1 + kR * 0.5;
      }

      const snapSpeedL = inZoneL ? 0.32 : 0.09;
      const snapSpeedR = inZoneR ? 0.32 : 0.09;

      curAngleL += (targetAngleL - curAngleL) * snapSpeedL;
      curAngleR += (targetAngleR - curAngleR) * snapSpeedR;

      curStretchL += (targetStretchL - curStretchL) * snapSpeedL;
      curStretchR += (targetStretchR - curStretchR) * snapSpeedR;

      jointLeft.style.transform = `rotate(${curAngleL}rad)`;
      jointRight.style.transform = `rotate(${curAngleR}rad)`;

      const waveL = 1 + Math.sin(phaseL * 3.4) * 0.07;
      const squishL = 1 / Math.sqrt(curStretchL * waveL);
      const skewL = Math.sin(phaseL * 2.3) * 8;

      const waveR = 1 + Math.sin(phaseR * 3.1 + 1.2) * 0.07;
      const squishR = 1 / Math.sqrt(curStretchR * waveR);
      const skewR = Math.sin(phaseR * 2.5 + 1.4) * 8;

      maggotLeftImg.style.transform = `scaleY(${curStretchL * waveL}) scaleX(${squishL}) skewX(${skewL}deg)`;
      maggotRightImg.style.transform = `scaleX(-1) scaleY(${curStretchR * waveR}) scaleX(${squishR}) skewX(${-skewR}deg)`;

      const reachL = maggotBaseReach * curStretchL;
      const reachR = maggotBaseReach * curStretchR;

      const tipLX = originLX + Math.sin(curAngleL) * reachL;
      const tipLY = originLY - Math.cos(curAngleL) * reachL;
      const midLX = originLX + Math.sin(curAngleL) * (reachL * 0.75);
      const midLY = originLY - Math.cos(curAngleL) * (reachL * 0.75);

      const tipRX = originRX + Math.sin(curAngleR) * reachR;
      const tipRY = originRY - Math.cos(curAngleR) * reachR;
      const midRX = originRX + Math.sin(curAngleR) * (reachR * 0.75);
      const midRY = originRY - Math.cos(curAngleR) * (reachR * 0.75);

      const distTipL = Math.hypot(bulbCenterX - tipLX, bulbCenterY - tipLY);
      const distMidL = Math.hypot(bulbCenterX - midLX, bulbCenterY - midLY);

      const distTipR = Math.hypot(bulbCenterX - tipRX, bulbCenterY - tipRY);
      const distMidR = Math.hypot(bulbCenterX - midRX, bulbCenterY - midRY);

      if (distTipL < 34 || distMidL < 28 || distTipR < 34 || distMidR < 28) {
        breakBulbAndClose();
        return;
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
