<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulb Concept</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
    }

    #light {
      position: absolute;
      width: 460px;
      height: 460px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 140, 25, 0.08) 0%, rgba(180, 60, 10, 0.025) 35%, rgba(30, 10, 0, 0.005) 60%, transparent 75%);
      mix-blend-mode: screen;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 20;
      will-change: left, top;
    }

    #wire {
      position: absolute;
      width: 6px;
      object-fit: fill;
      transform-origin: 50% 0;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      z-index: 5;
      will-change: transform, height, left, top;
    }

    #bulb {
      position: absolute;
      width: 80px;
      height: auto;
      transform-origin: 50% 0;
      cursor: grab;
      pointer-events: auto;
      user-select: none;
      -webkit-user-drag: none;
      touch-action: none;
      z-index: 10;
      will-change: transform, left, top;
    }
  </style>
</head>
<body>

  <main id="scene">
    <div id="light"></div>
    <img id="wire" src="wire.png" alt="">
    <img id="bulb" src="bulb.png" alt="">
  </main>

  <script>
    const wire = document.getElementById('wire');
    const bulb = document.getElementById('bulb');
    const light = document.getElementById('light');

    bulb.ondragstart = () => false;

    const wireWidth = 6;
    const bulbWidth = 80;
    const filamentOffset = 58;

    let anchorX = window.innerWidth / 2;
    let anchorY = 0;

    const restLength = 220;
    const stiffness = 0.055;
    const gravity = 0.6;
    const damping = 0.982;

    let x = anchorX;
    let y = restLength;
    let vx = 0;
    let vy = 0;

    let isDragging = false;
    let targetX = x;
    let targetY = y;

    window.addEventListener('resize', () => {
      anchorX = window.innerWidth / 2;
    });

    bulb.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      isDragging = true;
      bulb.style.cursor = 'grabbing';
      updateTarget(e.clientX, e.clientY);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      window.addEventListener('pointercancel', onPointerUp);
    });

    function onPointerMove(e) {
      if (!isDragging) return;
      updateTarget(e.clientX, e.clientY);
    }

    function onPointerUp() {
      if (!isDragging) return;
      isDragging = false;
      bulb.style.cursor = 'grab';
      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerup', onPointerUp);
      window.removeEventListener('pointercancel', onPointerUp);
    }

    function updateTarget(clientX, clientY) {
      const maxBottom = window.innerHeight - 130;
      const availableY = maxBottom - restLength;

      let pullY = (clientY - restLength) / (window.innerHeight - restLength);
      pullY = Math.max(0, Math.min(1, pullY));

      const tensionY = Math.pow(pullY, 1.85);
      targetY = restLength + availableY * tensionY;

      const rawDx = clientX - anchorX;
      const maxSide = window.innerWidth * 0.42;
      let pullX = rawDx / maxSide;
      pullX = Math.max(-1, Math.min(1, pullX));

      const tensionX = Math.sign(pullX) * Math.pow(Math.abs(pullX), 1.3);
      targetX = anchorX + tensionX * maxSide;
    }

    function render() {
      if (isDragging) {
        vx = (targetX - x) * 0.12;
        vy = (targetY - y) * 0.12;
        x += vx;
        y += vy;
      } else {
        const dx = x - anchorX;
        const dy = y - anchorY;
        const dist = Math.hypot(dx, dy) || 1;
        const stretch = dist - restLength;

        const fx = -stiffness * stretch * (dx / dist);
        const fy = -stiffness * stretch * (dy / dist) + gravity;

        vx = (vx + fx) * damping;
        vy = (vy + fy) * damping;

        x += vx;
        y += vy;
      }

      const dx = x - anchorX;
      const dy = y - anchorY;
      const dist = Math.hypot(dx, dy) || 1;
      const angle = -Math.atan2(dx, dy);

      wire.style.left = (anchorX - wireWidth / 2) + 'px';
      wire.style.top = anchorY + 'px';
      wire.style.height = (dist + 4) + 'px';
      wire.style.transform = `rotate(${angle}rad)`;

      bulb.style.left = (x - bulbWidth / 2) + 'px';
      bulb.style.top = y + 'px';
      bulb.style.transform = `rotate(${angle}rad)`;

      const lightX = x + (dx / dist) * filamentOffset;
      const lightY = y + (dy / dist) * filamentOffset;

      light.style.left = lightX + 'px';
      light.style.top = lightY + 'px';

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
